<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plainview setup</title>
  <link rel="stylesheet" href="options.css">
  <link rel="stylesheet" href="content.css">
  <link rel="stylesheet" href="onboarding.css">
</head>
<body>
  <main class="wrap onboarding">
    <header class="head">
      <img src="../../assets/icon-48.png" alt="" width="48" height="48">
      <div><p class="eyebrow">Plainview</p><div class="title-row"><h1>Setup guide</h1><span class="version" title="Plainview version">v<span id="version"></span></span></div></div>
      <button class="page-theme-toggle" type="button" aria-label="Toggle theme" title="Toggle theme"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"></path><path d="M12 3l0 18"></path><path d="M12 9l4.65 -4.65"></path><path d="M12 14.3l7.37 -7.37"></path><path d="M12 19.6l8.85 -8.85"></path></svg></button>
    </header>
  <a class="coffee-fab" href="https://buymeacoffee.com/karan.khosla" target="_blank" rel="noopener noreferrer" aria-label="Buy me a coffee" title="Buy me a coffee"><span class="coffee-icon" aria-hidden="true">☕</span><span class="coffee-label">Buy me a coffee</span></a>
    <section class="card">
      <h2>Allow file access</h2>
      <p id="intro"></p>
      <ol id="steps"></ol>
      <p class="note" id="firefoxNote" hidden></p>
    </section>
    <section class="card">
      <h2>Recommended settings</h2>
      <p>Open Settings to tune the reader after setup.</p>
      <p><a class="coffee" id="settingsLink" href="options.html">Open Plainview settings</a></p>
    </section>
    <section class="card">
      <h2>Setup status</h2>
      <div class="setup-state" id="accessState" data-state="checking">
        <span class="setup-state-icon" id="accessIcon" aria-hidden="true">…</span>
        <div>
          <strong id="accessStatus">Checking file access…</strong>
          <p class="note" id="accessHint"></p>
        </div>
      </div>
    </section>
  </main>
  <script src="onboarding.js" defer></script>
  <script src="coffee-drop.js" defer></script>
  <script src="page-theme.js" defer></script>
</body>
</html>
