name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - name: Scan for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --verbose
          /tmp/gitleaks dir . --redact --verbose
      - run: npm ci
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - name: Check tag matches package version
        run: |
          node -e "const v=require('./package.json').version; if ('v'+v !== process.env.GITHUB_REF_NAME) { console.error('tag '+process.env.GITHUB_REF_NAME+' does not match v'+v); process.exit(1); }"
      - run: npm test
      - run: npm run lint:firefox
      - run: npm run package
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="store/release-notes/${version}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" dist/plainview-*.zip \
              --title "Plainview $GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" dist/plainview-*.zip \
              --title "Plainview $GITHUB_REF_NAME" --generate-notes
          fi
